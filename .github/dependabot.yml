---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "23 4 1 * *"
      timezone: Asia/Singapore
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: cron
      cronjob: "23 4 1 * *"
      timezone: Asia/Singapore
    cooldown:
      default-days: 7
    groups:
      python-dev:
        patterns: [jupyterlab, pre-commit]
        update-types: [minor, patch]
      python-app:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: cron
      cronjob: "23 4 1 * *"
      timezone: Asia/Singapore
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: cron
      cronjob: "23 4 1 * *"
      timezone: Asia/Singapore
    cooldown:
      default-days: 7
    groups:
      pre-commit-hooks:
        patterns: ["*"]
